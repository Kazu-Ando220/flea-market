services:
  php:
    build: ./docker/php
    restart: on-failure
    volumes:
      - .:/var/www
    working_dir: /var/www
    entrypoint: >
      sh -c "chmod -R 777 /var/www/storage && php-fpm"

  nginx:
    image: nginx:latest
    restart: on-failure
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    restart: on-failure
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flea_market
    volumes:
      - mysql_data:/var/lib/mysql

  mailhog:
    image: mailhog/mailhog
    restart: on-failure
    ports:
      - "1025:1025"
      - "8025:8025"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: on-failure
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql

  queue-worker:
    build: ./docker/php
    restart: on-failure
    volumes:
      - .:/var/www
    working_dir: /var/www
    command: sh -c "sleep 10 && php artisan queue:work"
    depends_on:
      - php
      - mysql
      - mailhog

volumes:
  mysql_data:
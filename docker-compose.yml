services:
  php:
    build: ./docker/php
    volumes:
      - .:/var/www
    working_dir: /var/www
    entrypoint: >
      sh -c "chmod -R 777 /var/www/storage && php-fpm"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flea_market
    volumes:
      - mysql_data:/var/lib/mysql
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
  queue-worker:
    build: ./docker/php
    volumes:
      - .:/var/www
    working_dir: /var/www
    command: sh -c "sleep 10 && php artisan queue:work"
    depends_on:
      - php
      - mysql
      - mailhog

volumes:
  mysql_data:
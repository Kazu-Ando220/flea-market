services:
  php:
    build: ./docker/php
    volumes:
      - .:/var/www
    working_dir: /var/www

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flea_market
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: